<!--
  Favicons. The image files are GENERATED in the lixelbrand repo and copied
  here by tools/sync-brand.ps1 -- do not hand-edit or hand-tune them; fix the
  model in lixelbrand/src/ and re-sync. Each size is laid out natively there
  rather than downscaled, so linking a size to its true file matters.

  This markup, by contrast, is a web-platform concern and belongs to this repo.
-->

{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_path }}/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path }}/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="{{ favicon_path }}/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="{{ favicon_path }}/favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico">
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="application-name" content="{{ site.title }}">
<meta name="msapplication-TileColor" content="#2b2b2b">
<meta name="theme-color" content="#2b2b2b">
